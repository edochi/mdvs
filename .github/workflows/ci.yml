name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Set by dtolnay/rust-toolchain before we switched to installing from
  # rust-toolchain.toml; incremental artifacts are useless on a fresh runner
  # and only bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain pinned in rust-toolchain.toml — channel and
      # components both come from that file, so the version lives in one place.
      - run: rustup toolchain install
      # `lance-encoding`'s build.rs invokes `prost-build`, which needs `protoc`
      # on PATH. Ubuntu runners don't ship it by default.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      # Tests run with the mock embedder enabled — hermetic, no Hugging Face
      # in CI. Real-model tests are gated behind `#[ignore]`; see TODO-0184.
      - run: cargo test --features testing-mocks
      - run: cargo clippy --all-targets --features testing-mocks -- -D warnings
      - run: cargo fmt --check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check

  # Structural lints via ast-grep — catches things clippy's individual lints
  # miss or scatter (e.g., panic-emitting macros). Rules in `.ast-grep/rules/`;
  # config in `sgconfig.yml` at the repo root; mirror locally with `just lint-ast`.
  lint-ast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked ast-grep
      - run: ast-grep scan

  # Prettier version pinned to match .pre-commit-config.yaml and the Justfile.
  # The pre-commit hook can't catch non-idempotency (it only sees the file it
  # just rewrote); re-checking committed content does.
  fmt-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npx --yes prettier@3.6.2 --check "**/*.md"
