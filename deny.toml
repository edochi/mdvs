# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

# -- Advisories --------------------------------------------------------
[advisories]
# Fail on stale ignores so they're dropped as soon as a bump makes them unnecessary.
unused-ignored-advisory = "deny"
# Each reason: dependency path + a "Revisit when" trigger. Last checked 2026-10-19.
ignore = [
    # Via lancedb → lance-tokenizer → lindera 3.0.7
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; pulled in via lancedb 0.37 → lance-tokenizer 10 → lindera 3.0.7 → serde_yaml_ng 0.10. Revisit when lindera drops YAML: lindera 6.x has no YAML dependency." },
    # Via lancedb → lance-bitpacking and model2vec-rs → tokenizers (compile-time only, proc-macro)
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; compile-time only (proc-macro), pulled in via lancedb 0.37 → lance-bitpacking 10 and model2vec-rs → tokenizers 0.21. Revisit when both lance-bitpacking and tokenizers drop it; even the latest model2vec-rs (0.3.0) still uses tokenizers 0.21." },
    # Via model2vec-rs → hf-hub / tokenizers → indicatif 0.17
    { id = "RUSTSEC-2025-0119", reason = "number_prefix is unmaintained; pulled in via model2vec-rs → hf-hub / tokenizers → indicatif 0.17. Revisit when hf-hub / tokenizers move to indicatif 0.18, or if disabling their optional indicatif feature works; even the latest model2vec-rs (0.3.0) still uses hf-hub 0.4 and tokenizers 0.21." },
]

# -- Licenses ----------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "BSL-1.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # CC0: tiny-keccak 2.0.2, via arrow → ahash → const-random.
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
    # model2vec-rs has no license field in its Cargo.toml manifest
    { allow = ["MIT"], crate = "model2vec-rs" },
]

# -- Bans --------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Allow path-based deps inside the workspace to "look like" wildcards
# (path deps have no version requirement). Without this, our internal
# `tomljson = { path = "../tomljson" }` trips the wildcards rule.
allow-wildcard-paths = true

# -- Sources -----------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
