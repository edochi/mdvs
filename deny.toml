# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

# -- Advisories --------------------------------------------------------
[advisories]
# Fail on stale ignores so they're dropped as soon as a bump makes them unnecessary.
unused-ignored-advisory = "deny"
# Flag unmaintained crates anywhere in the graph, not just direct dependencies
# (cargo-deny 0.22 narrowed the default to "workspace").
unmaintained = "all"
# Each reason: dependency path + a "Revisit when" trigger. Last checked 2026-11-23.
ignore = [
    # Via lancedb → lance-tokenizer → lindera 3.0.7
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; pulled in via lancedb 0.37 → lance-tokenizer 10 → lindera 3.0.7 → serde_yaml_ng 0.10. Revisit when lance-tokenizer moves to lindera 6.x+ (no YAML dependency); even the latest lancedb (0.41.0) → lance-tokenizer 14.0.2 still requires lindera ^3.0.7." },
    # Via lancedb → lance-bitpacking and model2vec-rs → tokenizers (compile-time only, proc-macro)
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; compile-time only (proc-macro), pulled in via lancedb 0.37 → lance-bitpacking 10 and model2vec-rs → tokenizers 0.21. Revisit when both lance-bitpacking and tokenizers drop it; even the latest lancedb (0.41.0) → lance-bitpacking 14.0.2 still uses paste, and the latest model2vec-rs (0.5.0) still uses tokenizers 0.21." },
    # Via model2vec-rs → hf-hub / tokenizers → indicatif 0.17
    { id = "RUSTSEC-2025-0119", reason = "number_prefix is unmaintained; pulled in via model2vec-rs → hf-hub / tokenizers → indicatif 0.17. Revisit when hf-hub / tokenizers move to indicatif 0.18, or if disabling their optional indicatif feature works; even the latest model2vec-rs (0.5.0) still uses hf-hub 0.4 and tokenizers 0.21." },
    # Direct dependency, and also via lancedb → lance / datafusion → arrow
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, no replacement release; a direct dependency of mdvs, and also pulled in via lancedb 0.37 → lance 10 → datafusion 54 → arrow 58 (and lancedb itself). Replacing our own use would not remove it. Revisit when arrow and lance drop it (latest lancedb 0.41.0, lance 14.0.2 and arrow 60.2.0 still depend on it)." },
    # Via lancedb → datafusion → arrow (chrono-tz feature)
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained; pulled in via lancedb 0.37 → datafusion 54 → arrow 58 → arrow-array (chrono-tz feature, enabled by datafusion). Revisit when arrow-array drops it (latest 60.2.0 still has it as an optional dependency)." },
    # Via lancedb → lance / object_store
    { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained; pulled in via lancedb 0.37 → lance 10 and → object_store 0.13. Revisit when lance and object_store drop it (latest lancedb 0.41.0 → lance 14.0.2 and object_store 0.14 still depend on it)." },
]

# -- Licenses ----------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "BSL-1.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # CC0: tiny-keccak 2.0.2, via arrow → ahash → const-random.
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
    # model2vec-rs has no license field in its Cargo.toml manifest
    { allow = ["MIT"], crate = "model2vec-rs" },
]

# -- Bans --------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Allow path-based deps inside the workspace to "look like" wildcards
# (path deps have no version requirement). Without this, our internal
# `tomljson = { path = "../tomljson" }` trips the wildcards rule.
allow-wildcard-paths = true

# -- Sources -----------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
