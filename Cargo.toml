[workspace]
members = ["crates/mdvs", "crates/tomljson"]
resolver = "3"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = "github"

# lance-encoding's build.rs invokes prost-build, which needs the `protoc`
# binary on PATH. The CI workflows (ci.yml, audit.yml) install it via a
# manual step; cargo-dist's release.yml uses this dependencies map so the
# matrix.packages_install step picks the right package per OS.
[workspace.metadata.dist.dependencies.homebrew]
protobuf = '*'

[workspace.metadata.dist.dependencies.apt]
protobuf-compiler = '*'

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Deliberate, permanent allows.
missing_errors_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
module_name_repetitions = "allow"

# TEMPORARY: lints that still fire; this block shrinks wave by wave per TODO-0197.
# wave 5 — casts
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
# wave 6 — signatures
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
trivially_copy_pass_by_ref = "allow"
ref_option = "allow"
fn_params_excessive_bools = "allow"
implicit_hasher = "allow"
# wave 7 — function size
too_many_lines = "allow"
